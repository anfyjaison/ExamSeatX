      const [invModalOpen, setInvModalOpen] = useState(false);
      const [editingInv, setEditingInv] = useState(null);
      const [invForm, setInvForm] = useState({ facultyId: '', name: '', department: 'Civil Engineering', email: '', phone: '', maxDuties: 5, available: true });

      // Filters
      const [studentSearch, setStudentSearch] = useState('');
      const [studentTypeFilter, setStudentTypeFilter] = useState('ALL');
      const [studentDeptFilter, setStudentDeptFilter] = useState('ALL');

      const [selectedMatrixRoom, setSelectedMatrixRoom] = useState('C-207');
      const [matrixSearchReg, setMatrixSearchReg] = useState('');

      // Check backend on mount
      useEffect(() => {
        fetch(`${API_BASE_URL}/classrooms`)
          .then(res => res.json())
          .then(data => {
            if (data && data.length > 0) {
              setClassrooms(data);
              setBackendOnline(true);
            }
          })
          .catch(() => setBackendOnline(false));

        fetch(`${API_BASE_URL}/students`)
          .then(res => res.json())
          .then(data => {
            if (data && data.length > 0) setStudents(data);
          })
          .catch(() => {});

        fetch(`${API_BASE_URL}/invigilators`)
          .then(res => res.json())
          .then(data => {
            if (data && data.length > 0) setInvigilators(data);
          })
          .catch(() => {});
      }, []);

      // Client-Side CSP Engine (Runs instantly in browser if backend offline, or calls backend)
      const runCspEngine = async () => {
        if (backendOnline) {
          try {
            const res = await fetch(`${API_BASE_URL}/allocations/run`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ enforceNonAdjacency: true, enforceDiagonal: true, autoAssignInvigilators: true })
            }).then(r => r.json());

            setLastAllocResult(res);
            if (res.roomMatrices && res.roomMatrices.length > 0) {
              setRoomMatrices(res.roomMatrices);
              setSelectedMatrixRoom(res.roomMatrices[0].roomNumber);
            }
            // Fetch duties
            fetch(`${API_BASE_URL}/invigilators/duties`).then(r => r.json()).then(setDuties).catch(() => {});
            alert(`Allocation Success!\nTotal Placed: ${res.totalStudentsAllocated}\nConstraint Violations: ${res.constraintViolations}\nTime: ${res.executionTimeMs} ms`);
            setActiveTab('matrix');
            return;
          } catch (e) {
            console.warn('Fallback to browser CSP solver');
          }
        }

        // Browser CSP Solver
        const start = performance.now();
        const activeRooms = classrooms.filter(r => r.active);
        let studentQueue = [...students];

        // Sort round-robin by department to maximize diversity
        const byDept = {};
        students.forEach(s => {
          if (!byDept[s.department]) byDept[s.department] = [];
          byDept[s.department].push(s);
        });
        const interleaved = [];
        let more = true;
        while (more) {
          more = false;
          Object.keys(byDept).forEach(d => {
            if (byDept[d].length > 0) {
              interleaved.push(byDept[d].shift());
              more = true;
            }
          });
        }

        const generatedMatrices = [];
        let studentIdx = 0;
        let totalPlaced = 0;
        let violations = 0;

        activeRooms.forEach(room => {
          const seats = [];
          const deptCounts = {};
          let occupied = 0;

          for (let r = 1; r <= room.rowCount; r++) {
            for (let c = 1; c <= room.colCount; c++) {
              for (let b = 1; b <= room.benchCapacity; b++) {
                const cell = {
                  rowNum: r,
                  colNum: c,
                  benchSeatNum: b,
                  seatLabel: `R${r}-C${c}${room.benchCapacity > 1 ? '-S' + b : ''}`,
                  studentId: null,
                  registerNumber: '',
                  studentName: '',
                  department: '',
                  branchCode: '',
                  subjectCode: '',
                  examType: '',
                  conflict: false
                };

                if (studentIdx < interleaved.length) {
                  const candidate = interleaved[studentIdx++];
                  cell.studentId = candidate.id;
                  cell.registerNumber = candidate.registerNumber;
                  cell.studentName = candidate.studentName;
                  cell.department = candidate.department;
                  cell.branchCode = candidate.branchCode;
                  cell.subjectCode = candidate.subjectCode;
                  cell.examType = candidate.examType;
                  deptCounts[candidate.branchCode] = (deptCounts[candidate.branchCode] || 0) + 1;
                  occupied++;
                  totalPlaced++;
                }
                seats.push(cell);
              }
            }
          }

          generatedMatrices.push({
            roomNumber: room.roomNumber,
            rowCount: room.rowCount,
            colCount: room.colCount,
            benchCapacity: room.benchCapacity,
            totalCapacity: room.totalCapacity,
            occupiedSeats: occupied,
            cctvAvailable: room.cctvAvailable,
            departmentCounts: deptCounts,
            seats: seats
          });
        });

        // Browser Invigilator Department-Neutral Auto Assignment
        const assignedDuties = [];
        const usedInv = new Set();
        generatedMatrices.forEach(matrix => {
          if (matrix.occupiedSeats === 0) return;
          const roomDepts = new Set(matrix.seats.filter(s => s.studentId).map(s => s.department));
          
          let chosen = invigilators.find(i => !usedInv.has(i.id) && !roomDepts.has(i.department));
          if (!chosen) chosen = invigilators.find(i => !usedInv.has(i.id));

          if (chosen) {
            usedInv.add(chosen.id);
            assignedDuties.push({
              roomNumber: matrix.roomNumber,
              facultyName: chosen.name,
              facultyId: chosen.facultyId,
              facultyDepartment: chosen.department,
              totalStudentsInRoom: matrix.occupiedSeats,
              departmentNeutral: !roomDepts.has(chosen.department),

            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

            // Find headers
            let headerIdx = -1;
            let regIdx = -1, nameIdx = -1, deptIdx = -1, branchIdx = -1, subIdx = -1, typeIdx = -1;

            for (let i = 0; i < Math.min(jsonData.length, 10); i++) {
              const row = (jsonData[i] || []).map(c => String(c || '').toLowerCase().trim());
              const rIdx = row.findIndex(c => c.includes('reg') || c.includes('roll'));
              if (rIdx !== -1) {
                headerIdx = i;
                regIdx = rIdx;
                nameIdx = row.findIndex(c => c.includes('name'));
                branchIdx = row.findIndex(c => c.includes('branch'));
                deptIdx = row.findIndex(c => c.includes('dept'));
                subIdx = row.findIndex(c => c.includes('sub') || c.includes('course'));
                typeIdx = row.findIndex(c => c.includes('type') || c.includes('r/s'));
                break;
              }
            }

            if (headerIdx === -1) {
              regIdx = 0; nameIdx = 1; branchIdx = 3; deptIdx = 4; typeIdx = 5; subIdx = 8;
              headerIdx = 0;
            }

            const imported = [];
            for (let i = headerIdx + 1; i < jsonData.length; i++) {
              const row = jsonData[i];
              if (!row || !row[regIdx]) continue;
              const reg = String(row[regIdx]).trim();
              if (reg.toLowerCase().includes('register')) continue;

              let branch = branchIdx !== -1 && row[branchIdx] ? String(row[branchIdx]).trim() : '';

              const type = typeIdx !== -1 && row[typeIdx] ? String(row[typeIdx]).trim() : (reg.includes('23') ? 'Regular' : 'Supplementary');

                studentName: name,
                department: dept,
                branchCode: branch,
                semester: 'S6',
                subjectCode: sub,
                subjectName: `${branch} Core Theory`,
                examType: type,
                slot: 'SLOT B'

                        type="text"
                        value={studentForm.subjectCode}
                        onChange={(e) => setStudentForm({ ...studentForm, subjectCode: e.target.value })}
                        className="w-full px-3 py-2 border rounded-xl font-mono"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Slot</label>
                      <input
                        type="text"
                        value={studentForm.slot}
                        onChange={(e) => setStudentForm({ ...studentForm, slot: e.target.value })}
                        className="w-full px-3 py-2 border rounded-xl"
                      />
                    </div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onClick={() => setStudentModalOpen(false)} className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl">{editingStudent ? 'Update' : 'Save'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* INVIGILATOR MODAL */}
          {invModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden">
                <div className="bg-slate-900 p-5 text-white flex justify-between items-center">
                  <h3 className="font-bold text-sm">{editingInv ? `Edit Faculty ${editingInv.name}` : 'Add Faculty Invigilator'}</h3>
                  <button onClick={() => setInvModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={saveInvigilator} className="p-6 space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Faculty ID *</label>
                    <input
                      type="text"
                      value={invForm.facultyId}
                      onChange={(e) => setInvForm({ ...invForm, facultyId: e.target.value.toUpperCase() })}
                      className="w-full px-3 py-2 border rounded-xl font-mono uppercase"
                      required
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Full Name *</label>
                    <input
                      type="text"
                      placeholder="e.g. Dr. Sreejith R."
                      value={invForm.name}
                      onChange={(e) => setInvForm({ ...invForm, name: e.target.value })}
                      className="w-full px-3 py-2 border rounded-xl"
                      required
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Department *</label>
                    <select
                      value={invForm.department}
                      onChange={(e) => setInvForm({ ...invForm, department: e.target.value })}
                      className="w-full px-3 py-2 border rounded-xl"
                    >
                      {DEPARTMENTS.map(d => (
                        <option key={d.code} value={d.name}>{d.name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Email</label>
                      <input
                        type="email"
                        value={invForm.email}
                        onChange={(e) => setInvForm({ ...invForm, email: e.target.value })}
                        className="w-full px-3 py-2 border rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Max Duties</label>
                      <input
                        type="number"
                        min="1"
                        max="20"
                        value={invForm.maxDuties}
                        onChange={(e) => setInvForm({ ...invForm, maxDuties: parseInt(e.target.value, 10) })}
                        className="w-full px-3 py-2 border rounded-xl"
                      />
                    </div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onClick={() => setInvModalOpen(false)} className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl">{editingInv ? 'Update' : 'Save'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* HOW TO USE MODAL */}
          {isHowToUseOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl shadow-2xl max-w-xl w-full border border-slate-200 p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-slate-900 text-base">How to Use ExamSeatX</h3>
                  <button onClick={() => setIsHowToUseOpen(false)} className="text-slate-400 hover:text-slate-900 font-bold">✕</button>
                </div>
                <div className="space-y-3 text-xs text-slate-600">
                  <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <strong className="text-slate-900 block mb-0.5">1. Classrooms & Venues</strong>
                    Use the <strong>Classrooms</strong> tab to add new halls or customize rows, columns, bench capacity, and CCTV monitoring.
                  </div>
                  <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <strong className="text-slate-900 block mb-0.5">2. Student Rosters & Excel Import</strong>
                    Use <strong>Student Roster</strong> to manually add, edit, or delete candidates. Or click <strong>Import Excel / CSV</strong> to ingest raw university lists with variable headers.
                  </div>
                  <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <strong className="text-slate-900 block mb-0.5">3. Faculty Neutrality</strong>
                    Manage invigilators and run <strong>Auto-Assign Neutral Duties</strong> to guarantee invigilators never examine students from their own department.
                  </div>
                  <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <strong className="text-slate-900 block mb-0.5">4. CSP Seating & Verification</strong>
                    Click <strong>Run CSP Seating Solver</strong>. Open <strong>Visual Seat Map</strong> to inspect physical desks, verify zero non-adjacency conflicts, and locate candidates.
                  </div>
                  <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <strong className="text-slate-900 block mb-0.5">5. University PDF Reports</strong>
                    Export publication-ready Notice Board Seating Matrices and Room Attendance Sheets.
                  </div>
                </div>
                <div className="text-right pt-2 border-t">
                  <button onClick={() => setIsHowToUseOpen(false)} className="px-5 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow-sm">
                    Got it!
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
            ExamSeatX • Intelligent University Examination Seating System • Spring Boot & React
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
