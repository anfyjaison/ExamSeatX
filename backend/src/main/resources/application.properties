spring.application.name=examseatx
server.port=8080

# Primary H2 in-memory DB for quick zero-setup testing (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:examseatxdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Production configuration profile (activate with -Dspring.profiles.active=mysql)
# spring.datasource.url=jdbc:mysql://localhost:3306/examseatx?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart file upload settings for rosters
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
